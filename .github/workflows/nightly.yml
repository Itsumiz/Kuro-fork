name: Nightly Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build client and packages
        run: ./gradlew assemble

      - name: Generate changelog
        id: changelog
        run: |
          git fetch --tags --force origin || true
          DELIMITER=$(openssl rand -hex 8)
          echo "body<<${DELIMITER}" >> "$GITHUB_OUTPUT"
          echo "Nightly build (${GITHUB_SHA:0:7})" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "Commits in this build:" >> "$GITHUB_OUTPUT"
          if git rev-parse --verify refs/tags/nightly >/dev/null 2>&1; then
            PREV_SHA=$(git rev-parse refs/tags/nightly)
            if [ "$PREV_SHA" != "$GITHUB_SHA" ]; then
              git log "${PREV_SHA}..HEAD" --pretty=format:"* %h - %s (%an)" >> "$GITHUB_OUTPUT"
            else
              git log -n 50 --pretty=format:"* %h - %s (%an)" >> "$GITHUB_OUTPUT"
            fi
          else
            git log -n 50 --pretty=format:"* %h - %s (%an)" >> "$GITHUB_OUTPUT"
          fi
          echo "" >> "$GITHUB_OUTPUT"
          echo "${DELIMITER}" >> "$GITHUB_OUTPUT"

      - name: Publish Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: Nightly Build
          body: ${{ steps.changelog.outputs.body }}
          prerelease: true
          files: |
            build/libs/*.jar
            build/libs/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
