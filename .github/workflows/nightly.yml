name: Nightly Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build client and packages
        run: ./gradlew assemble

      - name: Generate changelog
        id: changelog
        run: |
          git fetch origin --tags || true
          PREV_TAG=$(git rev-parse nightly^{commit} 2>/dev/null || true)
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$GITHUB_SHA" ]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"* %h - %s (%an)")
          else
            COMMITS=$(git log --pretty=format:"* %h - %s (%an)")
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="* ${GITHUB_SHA:0:7} - Commit ${GITHUB_SHA:0:7}"
          fi

          {
            echo "body<<EOF"
            echo "Nightly build for commit ${GITHUB_SHA:0:7}"
            echo ""
            echo "Commits in this build:"
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: Nightly Build
          body: ${{ steps.changelog.outputs.body }}
          prerelease: true
          files: |
            build/libs/*.jar
            build/libs/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
